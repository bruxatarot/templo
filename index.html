<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bruxa Tarot • Templo del Prisma</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
  <style>
    body {
      background: #0a0a1f;
      color: white;
      font-family: 'Playfair Display', serif;
    }
    .hero {
      background: linear-gradient(rgba(10,10,31,0.75), rgba(20,10,40,0.9)), 
                  url('https://images.unsplash.com/photo-1506318137071-a8e063b4bec0');
      background-size: cover;
      background-position: center;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .glow {
      text-shadow: 0 0 40px rgba(168, 85, 247, 0.8);
    }
  </style>
</head>
<body>

  <!-- Hero -->
  <section class="hero text-center">
    <div class="max-w-4xl mx-auto px-6 relative z-10">
      <div class="mb-6 text-purple-300 tracking-widest text-sm">🌙 TEMPLO DEL PRISMA 🌙</div>
      
      <h1 class="text-6xl md:text-8xl font-bold tracking-tighter glow mb-6">
        BRUXA<br>TAROT
      </h1>

      <p class="text-2xl md:text-3xl text-purple-200 mb-16 max-w-2xl mx-auto">
        Un espacio sagrado donde tu alma recuerda su magia, su luz y su verdad.
      </p>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-xl mx-auto">
        <a href="#" class="block p-8 bg-purple-900/60 border border-purple-400/50 hover:border-purple-300 rounded-3xl transition-all hover:scale-105">
          <span class="text-5xl block mb-4">📅</span>
          <h3 class="text-2xl font-semibold">Calendario 30 Días</h3>
        </a>
        <a href="#" class="block p-8 bg-purple-900/60 border border-purple-400/50 hover:border-purple-300 rounded-3xl transition-all hover:scale-105">
          <span class="text-5xl block mb-4">🔮</span>
          <h3 class="text-2xl font-semibold">Portal Mágico</h3>
        </a>
      </div>
    </div>
  </section>

  <!-- Footer redes -->
  <footer class="py-12 bg-black/60 border-t border-purple-900/50 text-center">
    <p class="text-purple-300 mb-6">Sígueme en la red</p>
    <div class="flex justify-center gap-8 text-4xl">
      <a href="#" class="hover:text-pink-400 transition">📷</a>
      <a href="#" class="hover:text-blue-500 transition">📘</a>
      <a href="#" class="hover:text-black transition">🎵</a>
      <a href="#" class="hover:text-white transition">𝕏</a>
      <a href="#" class="hover:text-purple-400 transition">🧵</a>
      <a href="#" class="hover:text-red-500 transition">📺</a>
    </div>
  </footer>
</body>
</html>
